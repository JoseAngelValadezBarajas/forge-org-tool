[project]
name = "forge-org-api"
version = "0.1.0"
description = "FORGE Org Tool API bootstrap"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.32,<1",
]
[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<10", "ruff>=0.8,<1", "mypy>=1.13,<2"]
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/forge_org"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
