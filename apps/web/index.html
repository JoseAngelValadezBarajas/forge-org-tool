<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORGE Org Tool</title>
    <script>
      (() => {
        let theme = 'dark';
        try {
          const preference = localStorage.getItem('forge-theme');
          if (preference === 'dark' || preference === 'light') theme = preference;
          if (preference === 'system') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
