name: Forge 0.1.3 Preview Distribution

on:
  push:
    tags:
      - 'v0.1.3-preview.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build
        required: true
        default: v0.1.3-preview.1
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: '0.1.3'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release-ref:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject manual runs from non-main refs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'Release signing is allowed only from main or a release tag.' >&2
          exit 1

  android-release:
    needs: release-ref
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release version
        run: node tooling/scripts/release-version.mjs

      - name: Build production frontend
        run: npm run build

      - name: Reject development URLs and credentials from frontend assets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '10\.0\.2\.2|127\.0\.0\.1:5173' apps/web/dist; then
            echo 'Development Vite URLs must not be embedded in the production frontend.' >&2
            exit 1
          fi
          if grep -R -n -E 'SUPABASE_(SERVICE_ROLE|SECRET)|sb_secret_|service_role' apps/web/dist; then
            echo 'Privileged Supabase credentials must not be embedded in the release.' >&2
            exit 1
          fi

      - name: Initialize Tauri Android project
        working-directory: apps/desktop/src-tauri
        run: npx tauri android init --ci --skip-targets-install

      - name: Prepare persistent Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "ANDROID_SIGNING_PENDING: protected secret $name is not configured" >&2
              exit 1
            fi
          done
          keystore_file="$RUNNER_TEMP/forge-0.1.3-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          chmod 600 "$keystore_file"
          keytool -list -keystore "$keystore_file" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$keystore_file" >> "$GITHUB_ENV"

      - name: Configure generated Android Gradle signing
        shell: bash
        env:
          ANDROID_GRADLE_FILE: ${{ github.workspace }}/apps/desktop/src-tauri/gen/android/app/build.gradle.kts
          ANDROID_KEYSTORE_PROPERTIES_FILE: ${{ github.workspace }}/apps/desktop/src-tauri/gen/android/keystore.properties
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/scripts/configure-android-signing.mjs

      - name: Build signed Android release APK
        working-directory: apps/desktop/src-tauri
        run: npx tauri android build --ci --apk --target aarch64

      - name: Verify Android signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -path '*release*/*.apk' -print -quit)"
          test -n "$apk_path"
          test -s "$apk_path"
          apksigner verify --verbose --print-certs "$apk_path"
          mkdir -p release-artifacts
          output="release-artifacts/Forge-Org-Tool-${RELEASE_TAG}-android-arm64-release.apk"
          cp "$apk_path" "$output"
          (cd release-artifacts && sha256sum "$(basename "$output")" > SHA256SUMS.txt)

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: forge-0.1.3-preview-android-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error

  windows-release:
    needs: release-ref
    runs-on: windows-latest
    environment: release
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          uv sync --project apps/api --locked --group dev

      - name: Verify release version
        shell: pwsh
        run: node tooling/scripts/release-version.mjs

      - name: Build production frontend and sidecar
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/desktop/package_sidecar.ps1
          npm run build

      - name: Detect Authenticode signing configuration
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $overridePath = Join-Path $env:RUNNER_TEMP 'forge-windows-release.conf.json'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'forge-windows-signing.pfx'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            'WINDOWS_SIGNING_PENDING: WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD are not both configured.' | Set-Content -Path "$env:RUNNER_TEMP\WINDOWS_SIGNING_STATUS.txt"
            'configured=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if ($null -eq $certificate) { throw 'WINDOWS_SIGNING_PENDING: the configured PFX could not be imported.' }
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'https://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $overridePath -Encoding utf8
          "TAURI_WINDOWS_RELEASE_CONFIG=$overridePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          'configured=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if ($env:TAURI_WINDOWS_RELEASE_CONFIG -and (Test-Path -LiteralPath $env:TAURI_WINDOWS_RELEASE_CONFIG)) {
            npx tauri build --config $env:TAURI_WINDOWS_RELEASE_CONFIG
          } else {
            npm run desktop:build:nsis
          }

      - name: Verify Windows installer and checksum
        shell: pwsh
        env:
          WINDOWS_SIGNING_CONFIGURED: ${{ steps.windows-signing.outputs.configured }}
        run: |
          $installer = Get-ChildItem -LiteralPath 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'No NSIS installer was generated.' }
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          if ($env:WINDOWS_SIGNING_CONFIGURED -eq 'true') {
            & signtool verify /pa /all /v $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Configured Authenticode verification failed.' }
            $outputName = "Forge-Org-Tool-$env:RELEASE_TAG-windows-x64-setup.exe"
            'WINDOWS_SIGNING=SIGNED' | Set-Content -Path 'release-artifacts/WINDOWS_SIGNING_STATUS.txt'
          } else {
            $outputName = "Forge-Org-Tool-$env:RELEASE_TAG-windows-x64-setup-unsigned.exe"
            'WINDOWS_SIGNING_PENDING' | Set-Content -Path 'release-artifacts/WINDOWS_SIGNING_STATUS.txt'
          }
          $output = Join-Path (Resolve-Path 'release-artifacts') $outputName
          Copy-Item -LiteralPath $installer.FullName -Destination $output
          $hash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$outputName" | Set-Content -Path 'release-artifacts/SHA256SUMS.txt'

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: forge-0.1.3-preview-windows-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
