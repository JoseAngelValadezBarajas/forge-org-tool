name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - run: npm run check:acceptance:registry
      - run: npm run format:check:web
      - run: npm run lint:frontend
      - run: npm run build:packages
      - run: npx playwright install --with-deps chromium
      # Real product workflows (organization, planning, transfer, accessibility) in Chromium.
      - run: npm run test:e2e:full
      # Figma geometry evidence is advisory until the V2 migration is visually reviewed and re-baselined.
      - run: npm run test:e2e:ux11-visual
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ux11-figma-comparison-${{ github.sha }}
          path: docs/evidence/ux-1.1/visual-parity/
          if-no-files-found: warn
      - run: npm run test:packages
      - run: npm run test
      - run: npm run build
      - run: npm run test:acceptance:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: product-acceptance-evidence-${{ github.sha }}
          path: test-results/product-acceptance/
          if-no-files-found: warn
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - run: uv sync --project apps/api --locked --group dev
      - run: uv run --project apps/api --locked ruff format --check apps/api/src apps/api/tests
      - run: uv run --project apps/api --locked ruff check apps/api/src apps/api/tests
      - run: uv run --project apps/api --locked mypy apps/api/src
      - run: uv run --project apps/api --locked pytest apps/api/tests
      - run: uv run --project apps/api --locked python tooling/scripts/export-openapi.py --check
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - run: uv sync --project apps/api --locked --group dev
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/desktop/package_sidecar.ps1
      - run: npm run build
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --all-targets --manifest-path apps/desktop/Cargo.toml -- -D warnings
      - run: cargo clippy --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path apps/desktop/Cargo.toml
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: uv run --project apps/api --locked python -m unittest discover -s apps/desktop/tests -p "test_*.py"
      - run: uv run --project apps/api --locked python -m unittest discover -s tooling/scripts -p "test_*.py"
      - run: node --test tooling/scripts/desktop-window-contract.test.mjs
      - run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release
      - run: npm run test:desktop:acceptance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: forge-org-desktop-${{ github.sha }}-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*smoke.bmp
          if-no-files-found: warn
